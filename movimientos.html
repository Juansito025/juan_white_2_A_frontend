<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de API - People</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


   <nav>
    <ul class="nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="usuarios.html">Usuarios</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="cuentas.html">Cuentas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="movimientos.html">Movimientos</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="index.html">Inicio</a>
          </li>
      </ul>
   </nav>

    <main class="container py-5">
        <section class="text-center mb-5">
            <h1 class="fw-bold">Final Boss</h1>
            <p class="text-muted">
                Sistema de Control de Gastos Personales
            </p>
        </section>
        <section class="card shadow-sm mb-5"> 
            <div class="card-header bg-success text-white">
                <h2 class="h5 mb-0">Agregar Movimientos</h2>
            </div>
            <div class="card-body">
                <form id="formMovimientos" class="row g-3">
                    <input type="hidden" id="txtIdMovimiento">
                    <div class="col-md-4">
                        <label for="txtFecha" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="txtFecha" placeholder="10/08/2026">
                    </div>
                    <div class="col-md-4">
                        <label for="txtTipo" class="form-label">Tipo</label>
                        <input type="text" class="form-control" id="txtTipo" placeholder="Bancaria">
                    </div>
                    <div class="col-md-4">
                        <label for="txtFechaRegistro" class="form-label">Categoria</label>
                        <input type="text" class="form-control" id="txtCategoria" placeholder="6767-6767">
                    </div>
                    <div class="col-md-4">
                        <label for="txtDescripcion" class="form-label">Descripcion</label>
                        <input type="text" class="form-control" id="txtDescripcion" placeholder="Aqui va la Descripcion">
                    </div>
                    <div class="col-12">
                        <button id="btnGuardar" type="submit" class="btn btn-success">
                            Guardar Usuario
                        </button>

                        <button id="btnCancelar" type="button" class="btn btn-secondary d-none">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </section>
        <section class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-0">Lista de Usuario</h2>
            </div>
            <div class="card-body">
                <div id="mensaje" class="alert d-none" role="alert"></div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMovimientos">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <!-- Archivo principal JS usando modulos -->
    <script type="module" src="js/controllers/movimientosController.js"></script>
</body>

</html>
